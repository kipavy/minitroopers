  <path fill="#b8bed3" d="M4 23H5V24H4Z"/>
  <path fill="#b2b9d0" d="M3 24H11V25H3Z"/>
  <!-- the notches: a dark groove, lit underneath -->
  <path fill="#4e5777" d="M1 12H2V13H1ZM1 17H2V18H1Z"/>
  <path fill="#596597" d="M2 12H3V13H2ZM2 17H3V18H2Z"/>
